version: '3.8'

services:
  # 1. Nacos 注册中心
  nacos:
    image: nacos/nacos-server:v2.3.0
    container_name: nacos
    restart: always
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      JVM_XMS: 256m
      JVM_XMX: 512m
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8848/nacos" ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app-network

  # 2. Sentinel 限流/熔断
  sentinel:
    image: bladex/sentinel-dashboard:1.8.6
    container_name: sentinel
    restart: always
    ports:
      - "8858:8858"
    networks:
      - app-network

  # 3. Redis 缓存（带密码验证）
  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --appendfsync everysec
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network

  # 4. 网关
  gateway-server:
    build:
      context: ../gateway-server
      dockerfile: Dockerfile
    container_name: gateway-server
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_CLOUD_NACOS_SERVER_ADDR: ${NACOS_SERVER}
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: ${NACOS_SERVER}
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: ${NACOS_SERVER}
      SPRING_CLOUD_NACOS_DISCOVERY_IP: gateway-server
      SPRING_CLOUD_SENTINEL_TRANSPORT_DASHBOARD: sentinel:8858
      SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_DATA_REDIS_DATABASE: 0
      SPRING_DATA_REDIS_TIMEOUT: 5000ms
      SPRING_DATA_REDIS_LETTUCE_POOL_MAX_ACTIVE: 8
      SPRING_DATA_REDIS_LETTUCE_POOL_MAX_IDLE: 8
      SPRING_DATA_REDIS_LETTUCE_POOL_MIN_IDLE: 0
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  # 5. admin-service
  admin-service:
    build:
      context: ../services/admin-service
      dockerfile: Dockerfile
    container_name: admin-service
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_CLOUD_NACOS_SERVER_ADDR: ${NACOS_SERVER}
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: ${NACOS_SERVER}
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: ${NACOS_SERVER}
      SPRING_CLOUD_NACOS_DISCOVERY_IP: admin-service
      SPRING_CLOUD_SENTINEL_TRANSPORT_DASHBOARD: sentinel:8858
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_DATA_REDIS_DATABASE: 0
      SPRING_DATA_REDIS_TIMEOUT: 5000ms
      SPRING_DATA_REDIS_LETTUCE_POOL_MAX_ACTIVE: 8
      SPRING_DATA_REDIS_LETTUCE_POOL_MAX_IDLE: 8
      SPRING_DATA_REDIS_LETTUCE_POOL_MIN_IDLE: 0
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  # 6. ai-service
  ai-service:
