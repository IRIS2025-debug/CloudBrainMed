      SPRING_CLOUD_NACOS_SERVER_ADDR: ${NACOS_SERVER}
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: ${NACOS_SERVER}
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: ${NACOS_SERVER}
      SPRING_CLOUD_NACOS_DISCOVERY_IP: ai-service
      SPRING_CLOUD_SENTINEL_TRANSPORT_DASHBOARD: sentinel:8858
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_DATA_REDIS_DATABASE: 0
      SPRING_DATA_REDIS_TIMEOUT: 5000ms
      SPRING_DATA_REDIS_LETTUCE_POOL_MAX_ACTIVE: 8
      SPRING_DATA_REDIS_LETTUCE_POOL_MAX_IDLE: 8
      SPRING_DATA_REDIS_LETTUCE_POOL_MIN_IDLE: 0
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 100MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 100MB
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-local-integration-key}
      AI_PYTHON_SERVICE_URL: ${AI_PYTHON_SERVICE_URL:-http://host.docker.internal:8010}
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

