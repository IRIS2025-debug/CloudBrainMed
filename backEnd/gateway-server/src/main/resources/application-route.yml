spring:
  cloud:
    gateway:
      routes:
        # 检查医生 CT 伪影检测：doctor 向语义别名，重写后转发到 ai-service
        # 必须置于通用 /doctor-service/** 路由之前，否则会被其截走
        - id: doctor-ct-artifact-route
          uri: lb://ai-service
          predicates:
            - Path=/doctor-service/exam/ct-artifact,/doctor-service/exam/ct-artifact/**
          filters:
            - RewritePath=/doctor-service/exam/ct-artifact(?<segment>.*), /admin-service/ml/inference/ct-artifact${segment}
        - id: doctor-ct-lesion-route
          uri: lb://ai-service
          predicates:
            - Path=/doctor-service/exam/ct-lesion,/doctor-service/exam/ct-lesion/**
          filters:
            - RewritePath=/doctor-service/exam/ct-lesion(?<segment>.*), /admin-service/ml/inference/ct-lesion${segment}
        - id: ai-service-ml-route
          uri: lb://ai-service
          predicates:
            - Path=/admin-service/ml/**
        - id: admin-service-route
          uri: lb://admin-service
          predicates:
            - Path=/admin-service/**
        - id: doctor-avatar-route
          uri: lb://doctor-service
          predicates:
            - Path=/files/avatar/doctor/**
        - id: admin-avatar-route
          uri: lb://admin-service
          predicates:
            - Path=/files/avatar/admin/**
        - id: patient-avatar-route
          uri: lb://patient-service
          predicates:
            - Path=/files/avatar/patient/**
        - id: ai-service-route
          uri: lb://ai-service
          predicates:
            - Path=/ai-service/**
        - id: auth-service-route
          uri: lb://auth-service
          predicates:
            - Path=/auth-service/**
        - id: doctor-service-route
          uri: lb://doctor-service
          predicates:
            - Path=/doctor-service/**
        - id: inspection-doctor-route
          uri: lb://doctor-service
          predicates:
            - Path=/inspection-doctor/**
        - id: patient-api-route
          uri: lb://patient-service
          predicates:
            - Path=/api/patient/**
          filters:
            - RewritePath=/api/patient(?<segment>.*), /patient-service${segment}
        - id: payment-api-route
          uri: lb://payment-service
          predicates:
            - Path=/api/payment/**
          filters:
            - RewritePath=/api/payment(?<segment>.*), /payment-service/pay${segment}
        - id: patient-service-route
          uri: lb://patient-service
          predicates:
            - Path=/patient-service/**
        - id: payment-service-route
          uri: lb://payment-service
          predicates:
            - Path=/payment-service/**
        - id: service-api-route
          uri: lb://service-api
          predicates:
            - Path=/service-api/**
