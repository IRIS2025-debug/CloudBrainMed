spring:
  config:
    import: classpath:application-route.yml
  main:
    web-application-type: reactive
  profiles:
    include: route
  application:
    name: gateway-server
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:8080"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      enabled: true  # 添加这一行
      routes:
        - id: ai-service-ml-route
          uri: lb://ai-service
          predicates:
            - Path=/admin-service/ml/**
        - id: admin-service-route
          uri: lb://admin-service
          predicates:
            - Path=/admin-service/**
        - id: doctor-avatar-route
          uri: lb://doctor-service
          predicates:
            - Path=/files/avatar/doctor/**
        - id: admin-avatar-route
          uri: lb://admin-service
          predicates:
            - Path=/files/avatar/admin/**
        - id: patient-avatar-route
          uri: lb://patient-service
          predicates:
            - Path=/files/avatar/patient/**
        - id: ai-service-route
          uri: lb://ai-service
          predicates:
            - Path=/ai-service/**
        - id: auth-service-route
          uri: lb://auth-service
          predicates:
            - Path=/auth-service/**
        - id: doctor-service-route
          uri: lb://doctor-service
          predicates:
            - Path=/doctor-service/**
        - id: inspection-doctor-route
          uri: lb://doctor-service
          predicates:
            - Path=/inspection-doctor/**
        - id: patient-api-route
          uri: lb://patient-service
          predicates:
            - Path=/api/patient/**
          filters:
            - RewritePath=/api/patient(?<segment>.*), /patient-service${segment}
        - id: payment-api-route
          uri: lb://payment-service
          predicates:
            - Path=/api/payment/**
          filters:
            - RewritePath=/api/payment(?<segment>.*), /payment-service/pay${segment}
        - id: patient-service-route
          uri: lb://patient-service
          predicates:
            - Path=/patient-service/**
        - id: payment-service-route
          uri: lb://payment-service
          predicates:
            - Path=/payment-service/**
        - id: service-api-route
          uri: lb://service-api
          predicates:
            - Path=/service-api/**
        - id: exam-service-route
          uri: http://exam-service:8006
          predicates:
            - Path=/exam-service/**
    nacos:
      config:
        server-addr: nacos:8848
        # 配置优先级：本地 > Nacos
        enabled: false  # 临时禁用 Nacos 配置
      discovery:
        enabled: true
        register-enabled: true
        server-addr: nacos:8848
    sentinel:
      transport:
        dashboard: sentinel:8858
      eager: true

server:
  port: 8080