spring:
  data:
    redis:
      # 如果Redis在Docker中运行，且auth-service也在Docker中，使用服务名
      host: localhost
      # 如果auth-service在本地运行（不在Docker中），使用localhost或宿主机IP
      # host: localhost
      port: 6379
      # 从Docker环境变量中读取密码
      password: Redis2026SecureKey  # 如果没有密码则留空
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  application:
    name: auth-service
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER:127.0.0.1:8848}
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
      eager: true
  config:
    import: optional:nacos:auth-service.yml
  datasource:
    url: jdbc:postgresql://cloudbrainmed.rwlb.rds.aliyuncs.com:5432/cloudbrainmed?sslmode=disable&socketTimeout=30&connectTimeout=10&tcpKeepAlive=true&ApplicationName=auth-service
    username: iris
    password: Abc39173551
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 20000
      keepalive-time: 60000
      connection-test-query: SELECT 1
      validation-timeout: 5000
      leak-detection-threshold: 30000
    jpa:
      hibernate:
        ddl-auto: none
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
          format_sql: true

server:
  port: 8002

# 日志配置
logging:
  level:
    org.springframework.data.redis: DEBUG
    io.lettuce.core: DEBUG