# backend/services/ai-service/src/main/resources/application.yml
spring:
  application:
    name: ai-service
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 8001

internal:
  service-key: ${INTERNAL_SERVICE_KEY:}

# 训练流水线：Python 推理服务地址（环境无关，按需用环境变量覆盖）
ai:
  python-service:
    url: ${AI_PYTHON_SERVICE_URL:http://localhost:8010}
