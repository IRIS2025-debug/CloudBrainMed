# ===== CT金属伪影检测 — 训练配置 =====
# 每次训练复制一份到实验目录，保证实验可复现

data:
  # 2D DCM 切片路径（相对于 python-ml/）
  ct_dir: "D:/code/CloudBrainMed/BrainCT/BrainCT/Datasets/CT"
  mask_dir: "D:/code/CloudBrainMed/BrainCT/BrainCT/Datasets/MASK"
  # 训练/验证划分比例
  val_split: 0.2
  # 随机种子（保证划分可复现）
  seed: 42

training:
  # 批次大小（8GB 显存建议 2，16GB 可到 4）
  batch_size: 2
  # 训练轮数（100 轮约 2 小时）
  epochs: 100
  # 学习率
  learning_rate: 0.0001
  # 优化器: adam / adamw / sgd
  optimizer: "adamw"
  # 权重衰减（防过拟合）
  weight_decay: 0.00001
  # 学习率调度: cosine / step / plateau / none
  scheduler: "cosine"
  # 梯度累计步数（等效 batch = batch_size * accum_steps）
  gradient_accumulation: 4
  # 早停 patience（连续多少轮验证指标不提升就停止）
  early_stop_patience: 20
  # 混合精度训练（省显存、加速）
  fp16: true

model:
  # unet / attention
  type: "unet"
  in_channels: 1
  out_channels: 1

loss:
  # Dice 损失权重
  dice_weight: 0.5
  # BCE 损失权重
  bce_weight: 0.5
  # 正样本加重系数（缓解 1:708 不平衡）
  pos_weight: 2.0

augmentation:
  # 训练时启用数据增强
  enabled: true
  # 随机水平翻转概率
  hflip_prob: 0.5
  # 随机垂直翻转概率
  vflip_prob: 0.3
  # 随机旋转角度范围（度）
  rotate_limit: 30
  # 弹性变形
  elastic: true
  # Gamma 校正范围
  gamma_range: [0.8, 1.2]
  # 高斯噪声标准差
  noise_std: 0.01

logging:
  # 实验输出根目录（相对于 python-ml/）
  experiment_root: "experiments"
  # 每多少轮画一次图表
  viz_interval: 10
  # 每多少轮保存一次 checkpoint
  save_interval: 10
